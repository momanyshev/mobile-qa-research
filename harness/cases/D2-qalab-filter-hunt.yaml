id: D2-qalab-filter-hunt
title: Слепой поиск дефекта — только поиск и фильтры
adapter: qalab
platform: any
appId: ru.maksim.qalab
# Диагностический вариант D1 (этап 14.D). Прогон D1-…071349Z пропустил
# посеянный дефект фильтра критичности: тот срабатывает лишь при совместном
# применении двух фильтров, а агент за 600 с успел проверить их только по
# отдельности и сам отнёс комбинацию к незавершённому. Значит промах вызван
# глубиной обхода, а не ошибочным выводом — эта гипотеза здесь и проверяется.
#
# Два изменения против D1, оба названы явно, потому что делают прогон
# несопоставимым с D1 как независимую выборку:
#   * область сужена до поиска и фильтров — переходы статуса выведены наружу;
#   * бюджет поднят с 600 до 900 с.
#
# Чего в инструкции намеренно НЕТ: любого упоминания совместного применения
# фильтров. Дефект живёт именно в комбинации, поэтому подсказка про неё
# превратила бы измерение recall в проверку исполнительности. Сузить область
# честно, подсказать маршрут — нет.
#
# Сценарий read-only: смена статуса запрещена, и oracle проверяет неизменность
# состояния. Если данные всё же изменятся — это R-27 (инлайн wheel-picker
# перехватывает жест прокрутки), и oracle обязан это поймать.
instruction: >-
  Область: список дефектов — поиск и фильтры критичности и статуса. Риск:
  список может показывать не то, что должен. Проверь, соответствует ли
  поведение приложения тому, что оно само о себе заявляет: подписям полей,
  подсказкам и назначению контролов. Маршрут выбирай сам. Ничего не меняй,
  не создавай и не удаляй — статусы дефектов оставь как есть. По итогам
  сформулируй, что именно расходится с ожидаемым, со шагами воспроизведения;
  если расхождений нет — так и напиши.
preconditions:
  # Seed идентичен D1: critical+open даёт ровно одну запись, если фильтры
  # работают вместе, и три записи покрывают все нужные значения.
  apiSeed:
    - title: Кнопка входа не отвечает
      description: Приложение падает при нажатии на аватар пользователя
      severity: low
      status: open
    - title: Список загружается медленно
      description: Долгая загрузка перечня на холодном старте приложения
      severity: critical
      status: open
    - title: Экспорт отчёта не открывается
      description: Сформированный файл не открывается во внешнем приложении
      severity: critical
      status: in_progress
allowedActions:
  - read-ui
  - mobile-ui-interaction
forbiddenActions:
  - production-access
  - issue-deletion
  - issue-creation
  - status-change
limits:
  timeoutSeconds: 900
  retryPerAction: 3
oracle:
  api:
    checks:
      - type: count
        expected: 3
      - type: unchanged
  manualChecks:
    - Наблюдения агента сверены с фактическим состоянием флагов и классифицированы как найденный дефект, пропуск или ложное срабатывание
evidence:
  - transcript
  - initial-ui-json
  - final-ui-json
  - final-screenshot
  - api-before
  - api-after
teardown:
  resetState: true
