id: T1-record-types-charter
title: Типы записей — слепой обзор новой функциональности
adapter: qalab
platform: any
appId: ru.maksim.qalab
# Первый прогон по НОВОЙ фиче приложения (тип записи «задача» рядом с
# «дефектом»). Отличие от всех прошлых измерений принципиальное: дефекты здесь
# не посеяны — ни я, ни агент не знаем, есть ли они и где. Это делает прогон
# сопоставимым с ручной проверкой пользователя, выполненной по той же сборке.
#
# Режим — тот же, что во всех прошлых измерениях: внешней спецификации агенту
# НЕ даётся, ожидания он выводит из самозаявлений приложения (подписи полей,
# подсказки, назначение контролов). Это сохраняет сопоставимость с накопленной
# базой; режим с критериями приёмки — отдельный прогон, если понадобится.
#
# Charter намеренно read-only. Создание вынесено в отдельный case T2: смешав
# обзор и мутацию, нельзя было бы отличить «агент не заметил различий типов» от
# «агент не смог создать запись».
instruction: >-
  Область: типы записей в трекере. Приложение позволяет заводить не только
  дефекты. Разберись, какие типы записей существуют, чем они отличаются друг от
  друга при создании и при просмотре, и соответствует ли фактическое поведение
  тому, что приложение о себе заявляет — подписям полей, подсказкам, набору
  контролов. Ничего не создавай, не удаляй и не меняй: только смотри.
  По итогам сформулируй, что именно расходится с ожидаемым, со шагами
  воспроизведения; если расхождений нет — так и напиши.
preconditions:
  # Seed исправлен после первого прогона на Android. Было две записи, обе
  # дефекты, — и агент справедливо указал, что сторона ПРОСМОТРА задачи
  # (бейдж типа, секции шагов и результатов в карточке, заголовок
  # редактирования) при запрете на создание недостижима в принципе. Тот же
  # класс, что R-24: постусловие требует того, чего задание не даёт достичь.
  # Третья запись — задача, поэтому оба типа наблюдаемы без единой мутации.
  apiSeed:
    - type: task
      title: Вынести настройки уведомлений в отдельный экран
      description: Раздел настроек разросся и требует разделения на подэкраны
      severity: medium
      status: open
    - title: Не сохраняется черновик формы
      description: Введённые значения теряются при возврате на предыдущий экран
      severity: medium
      status: open
      stepsToReproduce: Открыть перечень записей и повторить действие из сценария
      expectedResult: Поведение совпадает с заявленным
      actualResult: Поведение отличается от заявленного
    - title: Счётчик не обновляется сразу
      description: Значение над перечнем отстаёт от фактического числа записей
      severity: low
      status: open
      stepsToReproduce: Открыть перечень записей и повторить действие из сценария
      expectedResult: Поведение совпадает с заявленным
      actualResult: Поведение отличается от заявленного
allowedActions:
  - read-ui
  - mobile-ui-interaction
forbiddenActions:
  - production-access
  - issue-deletion
  - issue-creation
  - status-change
limits:
  timeoutSeconds: 900
  retryPerAction: 3
oracle:
  api:
    checks:
      - type: unchanged
      - type: count
        expected: 3
  manualChecks:
    - Находки агента разобраны человеком и классифицированы как подтверждённые, отклонённые или недоказуемые
evidence:
  - transcript
  - initial-ui-json
  - final-ui-json
  - final-screenshot
  - api-before
  - api-after
teardown:
  resetState: true
