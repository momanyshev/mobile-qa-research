id: D3-qalab-network-hunt
title: Слепой поиск дефекта — создание записи при активном сетевом профиле
adapter: qalab
platform: any
appId: ru.maksim.qalab
# Третий класс посева (этап 14.D): сетевой, вносится fault-профилем прокси, а не
# флагом приложения. Схема портов на время таких прогонов:
#   backend  netlify dev на 8890
#   proxy    слушает 8888 → 8890, применяет профиль
#   app      собран на 8888, поэтому идёт через proxy и видит искажения
#   oracle   ORACLE_BASE_URL=http://127.0.0.1:8890 — напрямую, мимо профиля
# Иммунитет оракула здесь достигается маршрутом, а не заголовком: он читает
# фактическое состояние backend, тогда как искажается только путь приложения.
#
# Профиль `double-write` дублирует мутацию: один POST из приложения создаёт две
# записи. Для пользователя это наблюдаемо прямо в списке, поэтому класс лежит
# внутри наблюдаемой поверхности — в отличие от `seedDefectStatusTransition`,
# закрытого клиентской защитой (см. knowledge/hard-limits.md, ограничение 9).
#
# Область charter'а узкая по итогам D1/D2: широкая область даёт по одному
# измерению на контрол и слепа к тому, что требует довести сценарий до конца.
instruction: >-
  Область: создание дефекта и его отображение в списке. Риск: список может
  показывать не то, что должен показывать после твоего действия. Создай один
  дефект с названием «Сетевая проверка {{token}}» и убедись, что итоговое
  состояние списка соответствует тому, что ты сделал. Ничего не удаляй и не
  меняй статусы. По итогам сформулируй, что именно расходится с ожидаемым, со
  шагами воспроизведения; если расхождений нет — так и напиши.
preconditions:
  apiSeed:
    - title: Кнопка входа не отвечает
      description: Приложение падает при нажатии на аватар пользователя
      severity: low
      status: open
    - title: Список загружается медленно
      description: Долгая загрузка перечня на холодном старте приложения
      severity: critical
      status: open
allowedActions:
  - read-ui
  - mobile-ui-interaction
  - issue-creation
forbiddenActions:
  - production-access
  - issue-deletion
  - status-change
limits:
  timeoutSeconds: 900
  retryPerAction: 3
oracle:
  api:
    # Два seed плюс одна созданная запись. При активном `double-write` их будет
    # четыре, и проверка обязана упасть: оракул читает backend напрямую, то
    # есть видит фактический результат, а не то, что показали приложению.
    checks:
      - type: count
        expected: 3
  manualChecks:
    - Наблюдения агента сверены с активным fault-профилем и классифицированы как найденный дефект, пропуск или ложное срабатывание
evidence:
  - transcript
  - initial-ui-json
  - final-ui-json
  - final-screenshot
  - api-before
  - api-after
teardown:
  resetState: true
