id: T2-task-create
title: Типы записей — создание задачи
adapter: qalab
platform: any
appId: ru.maksim.qalab
# Целевая половина проверки новой фичи: создать запись типа «задача» и убедиться,
# что она сохранилась именно задачей. Отделено от charter'а T1 сознательно —
# смешав обзор и мутацию, нельзя отличить «не заметил различий» от «не смог
# создать».
#
# Oracle сверяет тип по backend, а не по виду карточки: тип — это то, что
# сохранилось, а не то, что нарисовано. Проверка `fields` ищет запись по
# названию с токеном run'а, поэтому прогон повторяем без коллизий.
#
# Спецификации агенту не даётся: какие поля обязательны для задачи и чем она
# отличается от дефекта, он выясняет из формы.
instruction: >-
  Заведи в трекере запись типа «задача» с названием «Задача {{token}}».
  Остальные поля заполни по своему усмотрению так, чтобы приложение приняло
  запись. Убедись, что она появилась в перечне. Ничего не удаляй и не меняй у
  существующих записей. Если что-то в поведении расходится с тем, что
  приложение о себе заявляет, — опиши это со шагами воспроизведения.
preconditions:
  apiSeed:
    - title: Не сохраняется черновик формы
      description: Введённые значения теряются при возврате на предыдущий экран
      severity: medium
      status: open
      stepsToReproduce: Открыть перечень записей и повторить действие из сценария
      expectedResult: Поведение совпадает с заявленным
      actualResult: Поведение отличается от заявленного
allowedActions:
  - read-ui
  - mobile-ui-interaction
  - issue-creation
forbiddenActions:
  - production-access
  - issue-deletion
  - status-change
limits:
  timeoutSeconds: 900
  retryPerAction: 3
oracle:
  api:
    checks:
      # Ровно одна новая запись: seed плюс созданная задача.
      - type: count
        expected: 2
      # Тип проверяется по сохранённому состоянию, а не по виду карточки.
      - type: fields
        where:
          title: Задача {{token}}
        expect:
          type: task
  manualChecks:
    - Находки агента разобраны человеком и классифицированы как подтверждённые, отклонённые или недоказуемые
evidence:
  - transcript
  - initial-ui-json
  - final-ui-json
  - final-screenshot
  - api-before
  - api-after
teardown:
  resetState: true
