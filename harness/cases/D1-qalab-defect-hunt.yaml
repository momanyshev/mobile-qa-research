id: D1-qalab-defect-hunt
title: Слепой поиск дефекта — поиск, фильтры и переходы статуса
adapter: qalab
platform: any
appId: ru.maksim.qalab
# Charter для измерения recall (этап 9.3). Один и тот же charter даётся и
# дефектной, и чистой сборке; агент не знает, посеян ли дефект и какой именно.
#
# Ожидаемое поведение агент может вывести из самого приложения, а не из
# внешней спецификации: подпись поля поиска гласит «Название или описание»,
# карточка подсказывает доступный переход статуса, а назначение фильтра
# самоочевидно. Поэтому charter честен — знание не подсовывается снаружи.
#
# Seed подобран так, чтобы каждый из посеянных дефектов был наблюдаем:
#   * у первой записи слово «аватар» есть только в описании;
#   * critical+open даёт ровно одну запись, если фильтры работают вместе;
#   * все записи в статусе open, поэтому запрещённый переход проверяем.
instruction: >-
  Область: список дефектов — поиск, фильтры критичности и статуса, а также
  смена статуса дефекта. Риск: список может показывать не то, что должен, а
  смена статуса — принимать недопустимое значение. Проверь, соответствует ли
  поведение приложения тому, что оно само о себе заявляет: подписям полей,
  подсказкам и назначению контролов. Маршрут выбирай сам. Ничего не удаляй.
  По итогам сформулируй, что именно расходится с ожидаемым, со шагами
  воспроизведения; если расхождений нет — так и напиши.
preconditions:
  apiSeed:
    - title: Кнопка входа не отвечает
      description: Приложение падает при нажатии на аватар пользователя
      severity: low
      status: open
    - title: Список загружается медленно
      description: Долгая загрузка перечня на холодном старте приложения
      severity: critical
      status: open
    - title: Экспорт отчёта не открывается
      description: Сформированный файл не открывается во внешнем приложении
      severity: critical
      status: in_progress
allowedActions:
  - read-ui
  - mobile-ui-interaction
  - status-change
forbiddenActions:
  - production-access
  - issue-deletion
  - issue-creation
limits:
  timeoutSeconds: 900
  retryPerAction: 3
oracle:
  api:
    # Charter не удаляет и не создаёт записи; их число обязано остаться прежним.
    checks:
      - type: count
        expected: 3
  manualChecks:
    - Наблюдения агента сверены с фактическим состоянием флагов и классифицированы как найденный дефект, пропуск или ложное срабатывание
evidence:
  - transcript
  - initial-ui-json
  - final-ui-json
  - final-screenshot
  - api-before
  - api-after
teardown:
  resetState: true
